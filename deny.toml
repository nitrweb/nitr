# cargo-deny policy: advisories, license allow-list, duplicate-version
# and source hygiene. Run locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
# A yanked crate in the lockfile is a red flag even without an advisory.
yanked = "deny"

[licenses]
# Everything the tree actually uses is permissive; anything new outside
# this list is a deliberate decision, not a silent import. (`r-efi` is
# triple-licensed and satisfies this list through MIT.)
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # The Mozilla root store data shipped by `webpki-root-certs`, which
    # `rustls-platform-verifier` (reqwest 0.13's trust store) carries as its
    # fallback roots. Permissive, data-only.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are wasted compile time and binary size, but the
# windows-sys/syn family churn makes "deny" unlivable; keep it visible.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
