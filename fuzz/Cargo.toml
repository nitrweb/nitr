# Fuzz targets for the parsers an attacker fully controls. Not a workspace
# member: built by cargo-fuzz on nightly.
#
#   cargo install cargo-fuzz
#   cargo +nightly fuzz run cookie_verify -- -max_total_time=60
#
# The crate carries a library (`src/lib.rs`) as well as the targets: it
# holds the shared input format every target decodes with. See its module
# docs for why the targets do not take `Arbitrary` tuples.
[package]
name = "nitr-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# `crypto` reaches JWT verification and AEAD open — both parse
# attacker-supplied tokens. `fetch` is deliberately NOT enabled: it would
# pull reqwest (over half the dependency graph) into every fuzz build to
# reach an IP-range `match` whose URL parsing lives upstream in the `url`
# crate, which is fuzzed by its own maintainers.
nitr-std = { path = "../crates/nitr-std", features = ["crypto"] }
nitr-http = { path = "../crates/nitr-http", features = ["multipart", "compression", "tls"] }
# The `tls_pem` target needs one valid certificate/key pair as its
# control — a fuzzer will never synthesize one, and committing a real one
# would put private key material in the repository. It is minted once per
# process instead.
rcgen = "0.14"
mlua = { version = "0.12", features = ["lua54", "vendored", "serialize", "send"] }
tokio = { version = "1", features = ["rt", "fs"] }
bytes = "1"
hyper = "1"
tempfile = "3"
# The oracle for the one differential worth having: `nitr.url.query_parse`
# hand-rolls the `+`-then-percent decoding that `form_urlencoded` already
# implements, and nitr-http itself uses the latter for `req.query`. Two
# implementations of one parse, over the same attacker bytes, in one repo.
# Free: nitr-http already depends on `url`, so it is compiled either way.
url = "2"

[lib]
name = "nitr_fuzz"
path = "src/lib.rs"

[[bin]]
name = "cookie_verify"
path = "fuzz_targets/cookie_verify.rs"
test = false
doc = false
bench = false

