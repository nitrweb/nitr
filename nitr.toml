# Nitr server configuration.
#
# Precedence (strongest first): CLI flags (--dev), NITR_* environment
# variables (e.g. NITR_LISTEN, NITR_WORKERS), this file, built-in defaults.
# Every setting below is optional; the values shown are the ones this
# repository uses for development.

# Address the server binds to. Default: "127.0.0.1:3000"
listen = "127.0.0.1:3000"

# Lua script executed once per request. Default: "scripts/handler.lua"
handler_script = "scripts/handler.lua"

# Lua script executed once at startup. Its returned table (plain data) is
# snapshotted into every state and exposed to handlers as `nitr.cfg`.
# Optional: when absent, `nitr.cfg` is nil.
config_script = "scripts/config.lua"

# Development mode: hot-reload the handler script on change.
# Default: false (also enabled by the --dev flag).
dev_mode = true

# Number of pooled Lua states (max concurrently executing handlers).
# Default: number of CPU cores.
#workers = 4

# Maximum concurrent streaming responses (each holds a pooled Lua state for
# its whole lifetime). Default: workers - 1, at least 1, so idle streams
# cannot pin the entire pool.
#max_streams = 3

# Trust an inbound X-Request-ID header (well-formed, <= 64 ASCII chars)
# instead of generating one. Enable only behind a proxy that sets or
# sanitizes the header.
#trust_request_id = false

# File the server writes its pid to at startup (removed at exit); what
# `nitr reload` uses to find the process.
#pidfile = "/run/nitr/nitr.pid"

# Request-size and connection limits, enforced before a request reaches Lua.
#[limits]
#max_body_bytes = 1048576    # request body cap (413 beyond it), counted as
                             # the body arrives, not trusted from
                             # Content-Length
#max_header_bytes = 16384    # request header buffer (min 8192)
#max_uri_bytes = 8192        # request URI cap (414 beyond it)
#max_connections = 1024      # concurrent TCP connections
#pool_wait_ms = 5000         # how long a request waits for a free Lua state
                             # before it is shed with 503 + Retry-After;
                             # 0 waits forever
#header_read_ms = 30000      # deadline for the complete request headers;
                             # the connection is closed past it. 0 disables
#body_read_ms = 30000        # how long each body read may wait for the
                             # next bytes (408 + connection close past it).
                             # Bounds progress, not total transfer: any
                             # allowed size may take as long as it keeps
                             # moving. 0 disables
#max_form_parts = 64         # parts allowed in a multipart/form-data body
#max_field_bytes = 65536     # per non-file form field; these become Lua
                             # strings, so this bounds the state's heap
#max_file_bytes = 10485760   # per uploaded file; files stream to disk in
                             # Rust and never enter the Lua heap. Raise
                             # `max_body_bytes` too — it bounds the whole
                             # request, uploads included.

# Filesystem policy for multipart uploads. The byte caps above stay in
# [limits] with every other byte cap; a directory belongs here, beside
# [static] dir and [templating] dir.
#[multipart]
# Root that every `part:save(path)` resolves inside. Paths passed to
# `part:save` are RELATIVE to it: absolute paths and anything climbing out
# with `..` are refused rather than re-rooted, so where a file lands always
# follows from the source. Unset leaves `part:save` unavailable — there is
# no safe directory to guess, the same call [templating] dir makes.
# Must exist and be writable at startup.
#
# It must NOT sit inside the handler script's own directory: `require` is
# pinned there, so an uploaded `.lua` file would be a loadable module.
# That combination refuses to boot. Inside [static] dir only warns, since
# serving uploads back is a real choice — just one to make deliberately.
#
# Prefer `part.safe_filename` over the raw `part.filename` when building
# the path: it is the client's name reduced to a plain file name (no
# separators, no control characters, never empty), so it cannot escape
# on its own. `part.filename` stays exactly as the client sent it.
#upload_dir = "uploads"

# Cookie defaults. Applies to cookies Nitr builds — the session and CSRF
# cookies, and anything through `res.cookies:set` / `:set_signed`. A
# handler that writes the `Set-Cookie` header itself bypasses this
# entirely; that cookie's attributes are the script's own business.
#[cookies]
# When those cookies carry the `Secure` attribute, if the caller's own
# options table does not set `secure` (an explicit value from Lua always
# wins, in both directions).
#   "auto"    Secure when [tls] enabled = true            (default)
#   "always"  always Secure: TLS is terminated in front of this process
#   "never"   never Secure: plain-HTTP development
#
# `"always"` is not a nicety. The most common deployment is a loopback
# bind behind a terminating proxy, where [tls] enabled = false is correct
# for this process *and* the cookies must still be Secure. Nothing here
# can detect that proxy, so a configuration resolving to "not secure"
# warns at startup rather than guessing.
#
# Deliberately not forced the way HttpOnly is: a Secure cookie sent over
# plain http is dropped by the browser silently, which is a far worse
# failure than a startup line.
#secure = "auto"

# SQLite database for the `nitr.db` builtin. Optional: without this
# section the `nitr.db` builtin is unavailable. `path` is the only
# required key; the pragma defaults below are already applied.
#
# WAL matters most: with one connection per pooled state, SQLite's default
# rollback journal serializes every writer and fails fast on contention.
# It also changes the on-disk file set to `app.db`, `app.db-wal` and
# `app.db-shm`, so copying only `app.db` while the server runs no longer
# captures a consistent snapshot -- use `VACUUM INTO` or stop the server.
[database]
path = "scripts/file.db"
#journal_mode = "wal"      # or "delete"; "keep" leaves the existing mode
#busy_timeout = 5000       # ms to wait on a lock instead of failing
#synchronous = "normal"    # the right pairing with WAL
#foreign_keys = true       # SQLite leaves this off, which surprises everyone
#cache_size = -2000        # KiB per connection
#migrations_dir = "migrations"

# The shared `nitr.cache` (enable with `cache` in [std] features). Bounded
# and owned by Rust; entries are serialized, so no Lua value crosses between
# states. Per-process: a restart empties it and two Nitr processes have two
# independent caches, so sessions and exact counters do not belong here.
#[cache]
#max_entries = 10000
#max_bytes = 33554432
#default_ttl = 300         # seconds; 0 means no expiry

# Response compression. Off by default: it trades the server's CPU for
# bandwidth, and that should be a decision rather than a surprise.
# Precompressed sidecars (`app.js.br` next to `app.js`) are served whenever
# they exist, regardless of this section — they cost nothing at runtime.
#[compression]
#enabled = true
#algorithms = ["br", "gzip"]  # offered best-first; the server's order wins
#min_size = 1024              # below this, compressing costs more than it saves
#types = ["text/*", "application/json", "application/javascript"]

# Cross-origin resource sharing, enforced in Rust: a preflight is answered
# without reaching a Lua state. Disabled until `origins` is set.
#[cors]
#origins = ["https://app.example.com"]  # or ["*"] for a public API
#methods = ["GET", "POST"]
#headers = ["content-type", "authorization"]
#expose_headers = ["x-request-id"]
#credentials = false          # cannot be combined with origins = ["*"];
                              # the server refuses to start if it is
#max_age = 86400              # seconds a browser may cache the preflight

# Inbound TLS termination (needs the `tls` Cargo feature; rustls over the
# `ring` provider). Off by default and never inferred from a certificate
# lying around: turning a port from plaintext to TLS is a decision.
#
# Both paths are required once `enabled = true`, and both are read exactly
# once, at startup — a half-configured or mismatched pair refuses to boot
# instead of failing every handshake on a port traffic already points at.
# A renewed certificate therefore takes effect on restart; SIGHUP reloads
# the Lua pool, not the certificate.
#
# The key path is NOT re-anchored by `nitr build`: a private key inside a
# copyable one-file artifact is a private key that leaks with it. Keep it
# external, like the database.
#[tls]
#enabled = true
#cert = "/etc/nitr/tls/fullchain.pem"  # PEM: leaf first, then intermediates
#key = "/etc/nitr/tls/privkey.pem"     # PEM: PKCS#8, PKCS#1 or SEC1
#min_version = "1.2"          # "1.2" (default) or "1.3". 1.2 is the floor:
                              # TLS 1.0/1.1 are deprecated (RFC 8996) and
                              # cannot be selected under any spelling

# Graceful shutdown. On SIGTERM/SIGINT the server stops accepting, stops
# reporting ready, lets in-flight work finish, and only then exits. A drain
# that runs out of time exits non-zero, because a cut request is not a clean
# shutdown.
#[shutdown]
#grace = 30                  # seconds for ordinary in-flight requests
#stream_grace = 5            # extra seconds for streaming/SSE bodies, spent
                             # only if one is still live

# Per-client-IP fixed-window rate limiting (429 + Retry-After beyond the
# budget). Disabled by default.
#[rate_limit]
#enabled = true
#requests = 100              # allowed requests per window and client IP
#window = 60                 # window length in seconds
#trust_forwarded_for = false # key by X-Forwarded-For (only behind a proxy)

# Outbound-request policy for the `nitr.fetch` builtin. By default requests to
# loopback/private/link-local addresses are refused (SSRF protection) and
# every redirect hop is re-checked against this policy.
# A hostname is resolved once, inside the resolver the connector uses, so a
# DNS server cannot answer one address to the check and another to the
# connect.
#[fetch]
#allowed_hosts = ["api.example.com"] # exact-host allow-list (all hops)
#allow_private_networks = false      # permit loopback/RFC1918 targets
#max_response_bytes = 8388608        # cap on resp:text()/resp:json() bodies
#max_concurrent = 8                  # max requests per nitr.await_all(...)
#max_per_request = 32                # total outbound calls one inbound
                                     # request may make; 0 removes the cap
#connect_timeout = 10.0              # seconds to establish a connection
#timeout = 30.0                      # default per-request budget; a per-call
                                     # `timeout` option overrides it
#pool_max_idle_per_host = 8
#max_retries = 5                     # ceiling on retry.attempts; retries are
                                     # opt-in per call and only ever applied
                                     # to idempotent methods
#proxy = "http://proxy.internal:3128" # unset reads HTTPS_PROXY/HTTP_PROXY
#no_proxy = false                    # ignore the proxy env vars entirely
#propagate_trace_context = false     # forward a W3C traceparent derived
                                     # from the inbound request id

# Static file serving (Rust-side: ETag/Last-Modified/304, content types,
# traversal protection). Scripts can add mounts with app:static(...).
#[static]
#dir = "public"              # directory to serve; unset disables
#mount = "/"                 # URL prefix
#spa = false                 # serve index.html for unknown paths
#cache_control = "public, max-age=3600"

# Template rendering for the `nitr.template` builtin (minijinja).
# Optional: without `dir` the builtin is unavailable — there is no default
# location to guess.
[templating]
dir = "scripts/templates"

# The `nitr test` runner.
#[testing]
#dir = "tests"             # where *.lua test files are discovered

# Environment handling: a dotenv-style file loaded at startup, and what
# the opt-in `nitr.env` builtin may read. The file's values never override
# the real process environment, and `NITR_*` internals are always hidden
# from scripts.
#[env]
#file = ".env"             # default: `.env` next to nitr.toml, if present
#allow = ["APP_", "API_TOKEN"]  # exact names, or prefixes ending in `_`;
                                # unset lets an enabled `env` builtin read
                                # any non-NITR_* variable

# Health and readiness endpoints, answered entirely in Rust (a handler
# cannot influence them). Enabled by default on the main listener.
# Liveness never touches a Lua state; readiness flips to 503 the moment a
# graceful drain starts, so a rolling deploy shifts traffic first.
#[health]
#enabled = true
#liveness = "/healthz"
#readiness = "/readyz"
#bind = "127.0.0.1:9090"   # optional: keep the probes off the public port
#max_connections = 64      # the probe listener's own connection cap, far
                           # below [limits] max_connections on purpose — a
                           # prober opens one connection, not a thousand

# Log output. "json" emits one object per line with the request/error
# fields as real keys, for log shippers; "text" (default) is for humans.
# RUST_LOG overrides `level`.
#[log]
#format = "text"
#level = "info"            # default: info (debug in dev mode)

# Standard library (`nitr.*`) modules exposed to scripts.
#
# A feature must also be compiled into the binary. The released `nitr`
# includes all of them; a build made with `--no-default-features` does not,
# and asking for one it lacks is a startup error naming the Cargo feature
# to enable. The standard
# library provides building blocks — opt into the features your scripts
# need (or replace them with your own modules). When the list is omitted,
# only a minimal set is enabled: "json", "http", "log", "time",
# "validate", "base64", "path", "url". Valid names: "dbg", "fetch",
# "template", "json", "db", "http", "log", "crypto", "cache", "time",
# "validate", "base64", "path", "url", "env".
# Listing a feature is strict: a listed feature missing its configuration
# (e.g. "db" without a `[database]` section) fails at startup.
[std]
features = [
    "dbg", "fetch", "template", "json", "db", "http", "log", "crypto",
    "cache", "time", "validate", "base64", "path", "url",
]

[lua]
# Lua standard libraries loaded into every state.
# Default: ["math", "table", "string", "utf8", "coroutine", "package"]
# "io" and "os" give scripts ambient filesystem/process access and are
# deliberately NOT enabled: `nitr.time` covers dates and clocks, so
# nothing here needs `os.date` — and with it would come `os.execute`,
# `os.remove` and `os.getenv`. Adding "io" also restores `dofile` and
# `loadfile`, which read and execute any file the process can reach.
# "debug" is REFUSED at startup: the Lua state is built with mlua's safe
# constructor, which cannot load it. It would also defeat the execution
# budget, since `debug.sethook` replaces the instruction-count hook that
# stops CPU-bound loops.
stdlib = ["math", "table", "string", "utf8", "coroutine", "package"]

# Per-state Lua memory limit in bytes. Default: 8388608 (8 MiB)
#memory_limit = 8388608

# Wall-clock budget per handler invocation in milliseconds; 0 disables it.
# Enforced by an instruction-count hook (stops CPU-bound loops) plus an
# async timeout (stops slow I/O). Default: 30000
#exec_timeout_ms = 30000
