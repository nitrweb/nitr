[package]
name = "nitr-std"
description = "The built-in `nitr.*` standard library for Nitr: dbg, fetch, template, json, http, log, crypto, and the SQLite driver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nitr-std"
readme = "../../README.md"
categories = ["network-programming", "api-bindings"]
keywords = ["lua", "stdlib", "builtins"]
include = ["src/**/*.rs", "Cargo.toml", "LICENSE-APACHE", "LICENSE-MIT"]

# The crates gate `doc_cfg` behind `--cfg docsrs`.

[lints]
workspace = true
[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

# Which `nitr.*` builtins are compiled in. Only the builtins with heavy
# exclusive dependencies are gated; `json`, `http`, `log`, `dbg` and
# `cache` need nothing that is not already required, so gating them would
# be ceremony rather than savings.
#
# The names match the `[std] features` values in `nitr.toml`, and asking
# for a builtin that was not compiled in is a startup error that says so.
[features]
default = []
all = ["crypto", "db", "fetch", "template"]

# argon2 password hashing, AEAD (`seal`/`open`), and JWT signing.
crypto = ["dep:argon2", "dep:chacha20poly1305"]
# The SQLite driver and `nitr migrate` (bundles SQLite itself).
db = ["dep:rusqlite"]
# The outbound HTTP client. By far the heaviest: reqwest pulls in over
# half of the whole dependency graph.
# `rustls` rides along only to install the `ring` crypto provider reqwest's
# `rustls-no-provider` feature expects (see the workspace manifest).
fetch = ["dep:futures-util", "dep:reqwest", "dep:rustls", "dep:url"]
# The minijinja template engine.
template = ["dep:minijinja"]

[lib]
name = "nitr_std"
path = "src/lib.rs"

[dependencies]
nitr-core = { workspace = true }

base64 = { workspace = true }
bitflags = { workspace = true }
bytes = { workspace = true }
# `nitr.time`: strftime formatting/parsing, UTC only (no tz database).
chrono = { workspace = true }
cookie = { workspace = true }
httpdate = { workspace = true }
# Signed cookies, `nitr.etag`, CSRF and sessions need these regardless of
# the `crypto` feature, so they are not optional.
getrandom = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
mlua = { workspace = true }
# `nitr.url` percent-encoding; the full `url` crate stays `fetch`-gated.
percent-encoding = { workspace = true }
# The `Serializer` traits behind `bounded.rs`: already in the graph through
# serde_json and mlua, so a manifest line rather than a new crate.
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

argon2 = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
minijinja = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
