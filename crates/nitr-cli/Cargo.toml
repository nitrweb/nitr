[package]
name = "nitr-cli"
description = "The Nitr command-line server binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nitr-cli"
readme = "../../README.md"
categories = ["web-programming::http-server", "command-line-utilities"]
keywords = ["dynamic-web-server", "http-server", "lua-server"]
include = ["src/**/*.rs", "src/**/*.lua", "Cargo.toml", "src/nitr-api.toml", "LICENSE-APACHE", "LICENSE-MIT"]
publish = true


[lints]
workspace = true
[[bin]]
name = "nitr"
path = "src/main.rs"
doc = false

# The crates gate `doc_cfg` behind `--cfg docsrs`.
[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

# The published binary is full-featured: someone installing `nitr` expects
# every builtin to be there. Building it with `--no-default-features` (plus
# whichever features are wanted) produces a smaller server.
[features]
default = ["all"]
# The CLI's own feature names must come on too: `nitr migrate` is gated on
# *this* crate's `db` feature, not the library's.
all = ["compression", "crypto", "db", "fetch", "multipart", "template", "tls"]

compression = ["nitr/compression"]
crypto = ["nitr/crypto"]
db = ["nitr/db"]
fetch = ["nitr/fetch"]
multipart = ["nitr/multipart"]
template = ["nitr/template"]
tls = ["nitr/tls"]

[dependencies]
nitr = { workspace = true }

anyhow = { workspace = true }
clap = { workspace = true }
bytes = { workspace = true }
mlua = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tar = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }
tracing-subscriber = { workspace = true }
