[package]
name = "nitr"
description = "A Rust web server embedding Lua for fast, efficient and safe dynamic backends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nitr"
readme = "../../README.md"
categories = ["web-programming::http-server", "network-programming"]
keywords = [
    "dynamic-web-server",
    "http-server",
    "lua-server"
]
include = ["src/**/*.rs", "Cargo.toml", "LICENSE-APACHE", "LICENSE-MIT"]

# The feature set an application picks. Each one turns on the matching
# `nitr.*` builtin or server capability; `all` is every optional one.
#
# Nothing is on by default, so a plain `cargo add nitr` builds the minimal
# server: routing, static files, and the `json`/`http`/`log`/`cache`
# builtins, which need no dependency the server does not already have.
# Configuring a builtin that was not compiled in is a startup error naming
# the feature to enable.

[lints]
workspace = true
[features]
default = []
all = [
    "compression",
    "crypto",
    "db",
    "fetch",
    "multipart",
    "template",
    "tls",
]

# `nitr.crypto` / `nitr.auth`: argon2 passwords, constant-time comparison.
crypto = ["nitr-http/crypto"]
# `nitr.db`: the SQLite driver, migrations, and `nitr migrate`.
db = ["nitr-http/db"]
# `nitr.fetch` / `nitr.await_all`: the outbound HTTP client. The heaviest
# by far — reqwest is over half of the full dependency graph.
fetch = ["nitr-http/fetch"]
# `nitr.template`: the minijinja engine.
template = ["nitr-http/template"]
# On-the-fly brotli/gzip response compression. Precompressed `.br`/`.gz`
# sidecars are served without it.
compression = ["nitr-http/compression"]
# `req:multipart(fn)`: streaming file uploads.
multipart = ["nitr-http/multipart"]
# `[tls]`: inbound TLS termination with rustls over the `ring` provider.
tls = ["nitr-http/tls"]

# Explicit targets so `cargo test`/`cargo build --examples` skip whatever
# the selected feature set cannot build, instead of failing. Everything not
# listed here needs no optional feature.
[lib]
name = "nitr"
path = "src/lib.rs"

[[test]]
name = "async_db"
path = "tests/async_db.rs"
required-features = ["db", "fetch"]

[[test]]
name = "auth"
path = "tests/auth.rs"
required-features = ["crypto"]

[[test]]
name = "data_io"
path = "tests/data_io.rs"
required-features = ["db", "fetch"]

[[test]]
name = "namespace"
path = "tests/namespace.rs"
required-features = ["crypto", "fetch"]

[[test]]
name = "standards"
path = "tests/standards.rs"
required-features = ["compression", "multipart"]

[[test]]
name = "stdlib"
path = "tests/stdlib.rs"
required-features = ["crypto"]

[[test]]
name = "tls"
path = "tests/tls.rs"
required-features = ["tls"]

[[example]]
name = "aggregate"
path = "examples/aggregate/main.rs"
required-features = ["db", "fetch"]

[[example]]
name = "basic-auth"
path = "examples/basic-auth/main.rs"
required-features = ["crypto"]

[[example]]
name = "bearer-auth"
path = "examples/bearer-auth/main.rs"
required-features = ["crypto"]

[[example]]
name = "data-io"
path = "examples/data-io/main.rs"
required-features = ["db", "fetch"]

[[example]]
name = "standards"
path = "examples/standards/main.rs"
required-features = ["compression", "multipart"]

[[example]]
name = "stdlib"
path = "examples/stdlib/main.rs"
required-features = ["crypto", "fetch"]

[[example]]
name = "tls"
path = "examples/tls/main.rs"
required-features = ["tls"]

# Benchmarks. `harness = false` because divan brings its own runner instead
# of libtest's. The builtins each target needs are compiled in
# unconditionally, so no benchmark declares `required-features`: the
# feature-gated groups inside `stdlib.rs` and `dispatch.rs` are `cfg`-ed
# out instead, which keeps the rest measurable on a minimal build.
[[bench]]
name = "runtime"
path = "benches/runtime.rs"
harness = false

[[bench]]
name = "dispatch"
path = "benches/dispatch.rs"
harness = false

[[bench]]
name = "stdlib"
path = "benches/stdlib.rs"
harness = false

[dependencies]
nitr-core = { workspace = true }
nitr-http = { workspace = true }
nitr-std = { workspace = true }

[dev-dependencies]
divan = { workspace = true }
flate2 = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
rusqlite = { workspace = true }
mlua = { workspace = true }
# The TLS example and the `tls` integration test mint their own
# self-signed certificate at run time; no key material is committed.
rcgen = { workspace = true }
# `query` is split out in reqwest 0.13; the integration tests use it.
reqwest = { workspace = true, features = ["query"] }
# reqwest's `rustls-no-provider` build needs a process default crypto
# provider; the test harness installs `ring`, as the fetch client does.
rustls = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
# Examples log through `tracing`, never `println!`, so their output goes
# through the same subscriber the server's own diagnostics do.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
rustc-args = []
