[package]
name = "nitr-http"
description = "The Nitr HTTP server layer: hyper server, configuration, and the request/response Lua bridge."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nitr-http"
readme = "../../README.md"
categories = ["web-programming::http-server", "network-programming"]
keywords = ["http-server", "lua-server"]
include = ["src/**/*.rs", "Cargo.toml", "LICENSE-APACHE", "LICENSE-MIT"]

# The crates gate `doc_cfg` behind `--cfg docsrs`.

[lints]
workspace = true
[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

# Server-layer capabilities. The `nitr-std` builtins are re-exported so a
# dependent picks its whole feature set in one place.
[features]
default = []
all = [
    "compression",
    "crypto",
    "db",
    "fetch",
    "multipart",
    "template",
    "tls",
]

# On-the-fly brotli/gzip response compression. Precompressed `.br`/`.gz`
# sidecars are served either way: that needs no encoder, only a `stat`.
compression = ["dep:brotli", "dep:flate2"]
# `req:multipart(fn)` file uploads.
multipart = ["dep:multer"]
# Inbound TLS termination (`[tls]`): rustls over the `ring` provider.
tls = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile"]

# Pass-through to the standard library.
crypto = ["nitr-std/crypto"]
db = ["nitr-std/db"]
fetch = ["nitr-std/fetch"]
template = ["nitr-std/template"]

[lib]
name = "nitr_http"
path = "src/lib.rs"

[dependencies]
nitr-core = { workspace = true }
nitr-std = { workspace = true }

async-channel = { workspace = true }
dotenvy = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }
http-body-util = { workspace = true }
httpdate = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
matchit = { workspace = true }
mime_guess = { workspace = true }
notify = { workspace = true }
mlua = { workspace = true }
percent-encoding = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

brotli = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
multer = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
# The PEM tests build their certificates and keys at run time; no key
# material is committed.
rcgen = { workspace = true }
# `test-util` enables `start_paused` so the body-timeout tests run on
# virtual time instead of real-clock margins.
tokio = { workspace = true, features = ["test-util"] }
