[workspace]
resolver = "2"
# `fuzz/` is its own crate: cargo-fuzz builds it on nightly.
exclude = ["fuzz"]
members = [
    "crates/nitr-core",
    "crates/nitr-std",
    "crates/nitr-http",
    "crates/nitr",
    "crates/nitr-cli",
]

# One lint policy for every workspace crate (each opts in with
# `lints.workspace = true`), so the discipline is mechanical instead of
# five hand-copied crate headers that drift. `clippy::unwrap_used`/
# `expect_used` are deliberately NOT here: the Cargo table applies to
# every target, and tests and benches use `expect` legitimately — the
# library crates deny them via `#![cfg_attr(not(test), deny(...))]` at
# their roots instead.
[workspace.lints.rust]
# Any warning is a hard error — including in tests and benches.
warnings = { level = "deny", priority = -1 }
rust-2018-idioms = { level = "deny", priority = -1 }
unsafe_code = "forbid"
missing_docs = "deny"
dead_code = "deny"

[workspace.lints.clippy]
# Pure-signal picks: each of these is a leftover debugging or stub marker
# that should never survive review.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"

[workspace.package]
version = "0.0.0-beta.2"
edition = "2024"
rust-version = "1.88.0"
authors = ["Jose Quintana <https://joseluisq.net>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/nitrweb/nitr"
homepage = "https://github.com/nitrweb/nitr"

[workspace.dependencies]
# Workspace crates
nitr-core = { version = "0.0.0-beta.2", path = "crates/nitr-core" }
nitr-std = { version = "0.0.0-beta.2", path = "crates/nitr-std" }
nitr-http = { version = "0.0.0-beta.2", path = "crates/nitr-http" }
nitr = { version = "0.0.0-beta.2", path = "crates/nitr" }

# External
anyhow = "1.0"
argon2 = "0.5"
async-channel = "2.3"
base64 = "0.22"
bitflags = "2.9"
# `default-features = false` drops the C/ffi and std-alloc extras; the pure
# Rust encoder is all the response compressor needs.
brotli = { version = "8.0", default-features = false, features = ["std"] }
bytes = "1.12"
# CLI argument parsing for the `nitr` binary.
clap = { version = "4.6", features = ["derive"] }
# `nitr.time` formats and parses timestamps with the strftime syntax
# `os.date` users already know; without default features there is no
# timezone database — UTC and fixed offsets only, by design.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# XChaCha20-Poly1305 for `nitr.crypto.seal`/`open`.
chacha20poly1305 = "0.10"
cookie = "0.18"
# Benchmark harness. `codspeed-divan-compat` is a drop-in replacement for
# `divan`: the same API, plus the instrumentation CodSpeed needs in CI. It
# falls back to plain divan when run outside a CodSpeed runner, so
# `cargo bench` keeps working locally.
divan = { package = "codspeed-divan-compat", version = "5.0" }
flate2 = "1.1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
getrandom = "0.2"
hmac = "0.12"
sha2 = "0.10"
http = "1.3"
http-body-util = "0.1.5"
httpdate = "1.0"
hyper = { version = "1.11", features = ["full"] }
hyper-util = { version = "0.1.11", features = ["full"] }
matchit = "0.8"
mime_guess = "2.0"
minijinja = { version = "2.24.0", features = ["loader"] }
multer = "3.1"
# Dev-mode file watcher: a save triggers the rebuild, not the next request.
dotenvy = "0.15"
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }
percent-encoding = "2.3"
proptest = "1"
mlua = { version = "0.12", features = ["async", "macros", "lua54", "serialize", "vendored", "anyhow", "send"] }
# TLS comes from rustls (ring provider), not the `default-tls` backend.
# `default-tls` means `native-tls`, which is OpenSSL on every unix except
# macOS, and `openssl-sys` needs a prebuilt libssl for the *target*: the
# illumos/BSD cross images ship none, so the build script aborts. rustls is
# pure Rust and needs nothing from the sysroot. `default-features = false`
# drops `default-tls`, so the other three defaults are re-listed by hand.
# `-native-roots` keeps reading the platform trust store, as native-tls did.
reqwest = { version = "0.12.15", default-features = false, features = [
    "json",
    "charset",
    "http2",
    "system-proxy",
    "rustls-tls-native-roots",
] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Inbound TLS termination (`[tls]`, the `tls` feature).
#
# `default-features = false` is what picks the crypto provider: rustls
# 0.23 defaults to `aws-lc-rs`, whose build needs a C toolchain — and NASM
# on Windows — which the release matrix cannot assume on every target it
# cross-compiles for. `ring` builds from the same prebuilt assembly
# everywhere and is already in the graph via reqwest's
# `rustls-tls-native-roots`, so choosing it here costs no extra
# dependency. The remaining defaults (`std`, `tls12`, `logging`) are
# re-listed by hand since disabling the defaults dropped them too.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# The async handshake. Same provider choice, spelled the way tokio-rustls
# spells it (`ring`, not `aws_lc_rs`).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# PEM parsing for `[tls] cert`/`key`, via the `PemObject` trait. This is
# the code `rustls-pemfile` merely wrapped before it was retired
# (RUSTSEC-2025-0134), and it rides in with rustls either way.
rustls-pki-types = "1.9"
# Self-signed certificates generated inside the TLS tests, so no private
# key is ever committed to the repository.
rcgen = "0.14"
serde = { version = "1.0", features = ["derive"] }
# `nitr build` bundles: the application archive appended to the binary.
tar = "0.4"
serde_json = "1.0.140"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync", "fs", "io-util"] }
toml = "0.8"
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"

# Release with debug symbols, for profiling (perf).
[profile.profiling]
inherits = "release"
debug = true
strip = false

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
lto = "fat"
opt-level = 3
# `panic` stays at the default `unwind` — never set it to "abort" here.
# The request panic boundary (`catch_unwind` in nitr-http's handler) and
# the mid-unwind pool recycling in nitr-core only exist under unwinding;
# with abort, a panic anywhere in request-reachable Rust kills the whole
# process and every in-flight connection. Abort's smaller binary is not
# worth an inert flagship safety layer; CI asserts the containment under
# this exact profile.
# Overflow wrapping in release while tests panic is two semantics for one
# arithmetic bug; check everywhere — a drifted counter now panics loudly
# (and is contained by the boundary above) instead of corrupting silently.
overflow-checks = true
rpath = false
strip = true
